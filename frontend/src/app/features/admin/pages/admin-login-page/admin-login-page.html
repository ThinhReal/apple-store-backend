<section class="admin-login">
  <div class="admin-login__card">
    <span class="admin-login__eyebrow">Admin</span>
    <h1 class="admin-login__title">Sign in to manage products</h1>
    <p class="admin-login__subtitle">
      Use your admin account to create, update, and delete products in the catalog.
    </p>

    <form class="admin-login__form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="admin-login__field">
        <span class="admin-login__label">Email</span>
        <input class="admin-login__input" type="email" formControlName="email" autocomplete="username" />
      </label>

      <label class="admin-login__field">
        <span class="admin-login__label">Password</span>
        <input
          class="admin-login__input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </label>

      <button class="admin-login__submit" type="submit" [disabled]="loading()">
        {{ loading() ? 'Signing in...' : 'Login' }}
      </button>
    </form>
  </div>
</section>
