<section class="sign-up">
  <div class="sign-up__card">
    <span class="sign-up__eyebrow">Customer Account</span>
    <h1 class="sign-up__title">Create your account</h1>
    <p class="sign-up__subtitle">
      Sign up to save your details for checkout. You can keep browsing and building your cart without an account
      until you are ready to place an order.
    </p>

    <form class="sign-up__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="sign-up__row">
        <label class="sign-up__field">
          <span class="sign-up__label">First Name</span>
          <input
            class="sign-up__input"
            type="text"
            formControlName="first_name"
            autocomplete="given-name"
            [class.sign-up__input--invalid]="form.controls.first_name.touched && form.controls.first_name.invalid"
          />
        </label>

        <label class="sign-up__field">
          <span class="sign-up__label">Last Name</span>
          <input
            class="sign-up__input"
            type="text"
            formControlName="last_name"
            autocomplete="family-name"
            [class.sign-up__input--invalid]="form.controls.last_name.touched && form.controls.last_name.invalid"
          />
        </label>
      </div>

      <label class="sign-up__field">
        <span class="sign-up__label">Email</span>
        <input
          class="sign-up__input"
          type="email"
          formControlName="email"
          autocomplete="email"
          [class.sign-up__input--invalid]="form.controls.email.touched && form.controls.email.invalid"
        />
      </label>

      <label class="sign-up__field">
        <span class="sign-up__label">Address (optional)</span>
        <input class="sign-up__input" type="text" formControlName="address" autocomplete="street-address" />
      </label>

      <label class="sign-up__field">
        <span class="sign-up__label">Password</span>
        <input
          class="sign-up__input"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          [class.sign-up__input--invalid]="form.controls.password.touched && form.controls.password.invalid"
        />
        <span class="sign-up__hint">
          8-30 characters with uppercase, lowercase, number, and special character.
        </span>
      </label>

      <label class="sign-up__field">
        <span class="sign-up__label">Confirm Password</span>
        <input
          class="sign-up__input"
          type="password"
          formControlName="confirm_password"
          autocomplete="new-password"
          [class.sign-up__input--invalid]="
            (form.controls.confirm_password.touched && form.controls.confirm_password.invalid) ||
            (form.touched && form.hasError('passwordMismatch'))
          "
        />
      </label>

      <button class="sign-up__submit" type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating account...' : 'Sign Up' }}
      </button>
    </form>

    <p class="sign-up__footer">
      Already have an account?
      <a class="sign-up__link" [routerLink]="['/login']" [queryParams]="{ returnUrl: route.snapshot.queryParamMap.get('returnUrl') }">
        Sign in
      </a>
    </p>
  </div>
</section>
