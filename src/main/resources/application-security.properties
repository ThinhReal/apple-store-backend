# JWT defaults (override in production via environment variables)
app.jwt.secret=${JWT_SECRET:change-this-dev-secret-key-to-at-least-32-characters}
app.jwt.access-token-expiration-seconds=900
app.jwt.refresh-token-expiration-seconds=604800

# Cookie settings (set app.cookie.secure=true when deploying with HTTPS)
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=Strict

# Default admin seed credentials (override in production)
app.admin.email=${ADMIN_EMAIL:admin@groveroot.com}
app.admin.password=${ADMIN_PASSWORD:Admin@1234}

# Daily at 02:00 (server timezone) — purge refresh tokens past expiry_date
app.refresh-token.cleanup-cron=${REFRESH_TOKEN_CLEANUP_CRON:0 0 2 * * *}
